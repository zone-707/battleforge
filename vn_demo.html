<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AT NIGHT with you - Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Georgia', serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ===== MAIN MENU ===== */
  #mainMenu {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 60px;
    background: radial-gradient(ellipse at 70% 30%, #1a0a0a 0%, #0a0a0a 60%);
  }

  .menu-bg-glow {
    position: absolute;
    top: -100px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(120,0,0,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .game-title {
    margin-bottom: 50px;
  }

  .title-main {
    font-size: 3rem;
    font-weight: bold;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
  }

  .title-sub {
    font-size: 2rem;
    color: #cc2222;
    font-weight: bold;
    margin-left: 20px;
  }

  .title-tag {
    font-size: 0.85rem;
    color: #666;
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .menu-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 1.4rem;
    font-family: 'Georgia', serif;
    text-align: left;
    padding: 10px 0;
    cursor: pointer;
    transition: color 0.2s, padding-left 0.2s;
    width: fit-content;
  }

  .menu-btn:hover, .menu-btn.active {
    color: #cc2222;
    padding-left: 12px;
  }

  .menu-btn.play-btn {
    color: #cc2222;
    font-size: 1.5rem;
  }

  /* ===== GAME SCREEN ===== */
  #gameScreen {
    display: none;
    position: absolute; inset: 0;
    flex-direction: column;
  }

  #gameScreen.active { display: flex; }

  /* Background area */
  .game-bg {
    flex: 1;
    background: #0d0d0d;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .scene-overlay {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(30,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
  }

  /* Character name */
  .char-name {
    position: absolute;
    bottom: 130px;
    left: 20px;
    font-size: 0.9rem;
    color: #cc2222;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: bold;
  }

  /* Dialog box */
  .dialog-box {
    position: relative;
    background: rgba(0,0,0,0.85);
    border: 1.5px dashed rgba(255,255,255,0.5);
    border-radius: 12px;
    margin: 0 16px 16px;
    padding: 20px 24px 36px;
    min-height: 100px;
    cursor: pointer;
  }

  .dialog-text {
    font-size: 1rem;
    line-height: 1.7;
    color: #e8e8e8;
    min-height: 50px;
  }

  /* Next arrow */
  .next-arrow {
    position: absolute;
    bottom: 10px;
    right: 16px;
    font-size: 1.2rem;
    color: #cc2222;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Bottom controls */
  .game-controls {
    display: flex;
    justify-content: space-between;
    padding: 8px 24px 12px;
    background: rgba(0,0,0,0.9);
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: #888;
    font-size: 0.85rem;
    font-family: 'Georgia', serif;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .ctrl-btn:hover { color: #fff; }

  /* Choices */
  .choices-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }

  .choices-overlay.active { display: flex; }

  .choice-btn {
    background: rgba(20,0,0,0.9);
    border: 1px dashed rgba(255,255,255,0.4);
    border-radius: 8px;
    color: #e0e0e0;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    padding: 14px 40px;
    cursor: pointer;
    width: 80%;
    max-width: 360px;
    text-align: center;
    transition: border-color 0.2s, color 0.2s;
  }

  .choice-btn:hover {
    border-color: #cc2222;
    color: #fff;
  }

  /* History overlay */
  #historyOverlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 20;
    flex-direction: column;
    padding: 24px 20px;
    overflow-y: auto;
  }

  #historyOverlay.active { display: flex; }

  .history-title {
    font-size: 1rem;
    color: #cc2222;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: center;
  }

  .history-item {
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .history-char { color: #cc2222; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 4px; }
  .history-line { color: #ccc; font-size: 0.9rem; line-height: 1.6; }

  .close-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    color: #888;
    padding: 10px;
    cursor: pointer;
    margin-top: 20px;
    font-family: 'Georgia', serif;
    transition: color 0.2s;
  }

  .close-btn:hover { color: #fff; }

  /* Settings overlay */
  #settingsOverlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 20;
    flex-direction: column;
    padding: 40px 30px;
  }

  #settingsOverlay.active { display: flex; }

  .settings-title {
    font-size: 0.85rem;
    color: #cc2222;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    text-align: center;
  }

  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .setting-label { font-size: 1.1rem; font-weight: bold; color: #e0e0e0; }

  .setting-control {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .setting-control input[type=range] {
    -webkit-appearance: none;
    width: 120px;
    height: 2px;
    background: rgba(255,255,255,0.2);
    outline: none;
  }

  .setting-control input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: #cc2222;
    border-radius: 50%;
    cursor: pointer;
  }

  .setting-val { color: #e0e0e0; font-size: 0.95rem; width: 45px; text-align: right; }

  .settings-back {
    margin-top: auto;
    align-self: flex-end;
    background: none;
    border: none;
    color: #888;
    font-size: 1rem;
    font-family: 'Georgia', serif;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: color 0.2s;
  }

  .settings-back:hover { color: #fff; }

  /* Tap hint */
  .tap-hint {
    position: absolute;
    bottom: 160px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- ===== MAIN MENU ===== -->
<div id="mainMenu">
  <div class="menu-bg-glow"></div>
  <div class="game-title">
    <div class="title-main">AT NIGHT <span class="title-sub">with you</span></div>
    <div class="title-tag">Demo</div>
  </div>
  <div class="menu-list">
    <button class="menu-btn play-btn" onclick="startGame()">play</button>
    <button class="menu-btn" onclick="showSettings()">Settings</button>
    <button class="menu-btn">Memories</button>
    <button class="menu-btn">Creator</button>
    <button class="menu-btn">Exit</button>
  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="gameScreen">
  <!-- Background -->
  <div class="game-bg" id="gameBg">
    <div class="scene-overlay"></div>
    <div class="char-name" id="charName"></div>
    <div class="tap-hint">tap to continue</div>

    <!-- Choices -->
    <div class="choices-overlay" id="choicesOverlay"></div>
  </div>

  <!-- Dialog -->
  <div class="dialog-box" onclick="nextDialogue()">
    <div class="dialog-text" id="dialogText"></div>
    <div class="next-arrow" id="nextArrow">▼</div>
  </div>

  <!-- Controls -->
  <div class="game-controls">
    <button class="ctrl-btn" onclick="showHistory()">History</button>
    <button class="ctrl-btn" onclick="toggleHide()">hide</button>
    <button class="ctrl-btn" onclick="showSettings()">Options</button>
  </div>

  <!-- History Overlay -->
  <div id="historyOverlay">
    <div class="history-title">History</div>
    <div id="historyList"></div>
    <button class="close-btn" onclick="hideHistory()">close</button>
  </div>

  <!-- Settings Overlay -->
  <div id="settingsOverlay">
    <div class="settings-title">Settings</div>
    <div class="setting-row">
      <span class="setting-label">Background</span>
      <div class="setting-control">
        <input type="range" min="0" max="100" value="100" oninput="updateSetting(this,'bgVal')">
        <span class="setting-val" id="bgVal">100%</span>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">Message speed</span>
      <div class="setting-control">
        <input type="range" min="1" max="100" value="100" oninput="updateSetting(this,'speedVal')">
        <span class="setting-val" id="speedVal">100%</span>
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
      <button class="settings-back" onclick="goToMainMenu()" style="color:#cc2222;">Main Menu</button>
      <button class="settings-back" onclick="hideSettings()">go back</button>
    </div>
  </div>
</div>

<script>
  // ===== DIALOGUE DATA =====
  const story = [
    { char: "", text: "คืนนี้มืดกว่าทุกคืนที่ผ่านมา...", bg: "#0d0d0d" },
    { char: "???", text: "เธอยังอยู่ที่นี่ใช่ไหม", bg: "#0d0a0a" },
    { char: "คุณ", text: "...ใคร? ใครอยู่ในความมืดนั้น?", bg: "#0d0a0a" },
    { char: "???", text: "ฉันรอเธอมานานมากแล้ว", bg: "#0a0808" },
    {
      char: "",
      text: "",
      bg: "#0a0808",
      choices: [
        { text: "เข้าหาเสียงนั้น", next: 5 },
        { text: "วิ่งหนี", next: 6 }
      ]
    },
    { char: "คุณ", text: "ฉันเดินเข้าหาความมืด... เท้าแต่ละก้าวหนักขึ้นเรื่อยๆ", bg: "#080505", end: false },
    { char: "คุณ", text: "ฉันวิ่งหนี แต่ความมืดมันตามทัน...", bg: "#050505", end: false },
  ];

  let currentIndex = 0;
  let isTyping = false;
  let typeTimeout = null;
  let history = [];
  let msgSpeed = 30;
  let hidden = false;

  function startGame() {
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('gameScreen').classList.add('active');
    currentIndex = 0;
    showDialogue(0);
  }

  function showDialogue(index) {
    if (index >= story.length) return;
    const scene = story[index];

    // bg color
    document.getElementById('gameBg').style.background = scene.bg || '#0d0d0d';

    // choices?
    if (scene.choices) {
      document.getElementById('charName').textContent = '';
      document.getElementById('dialogText').textContent = '';
      document.getElementById('nextArrow').style.display = 'none';
      showChoices(scene.choices);
      return;
    }

    document.getElementById('choicesOverlay').classList.remove('active');
    document.getElementById('charName').textContent = scene.char || '';
    document.getElementById('nextArrow').style.display = 'block';

    // add to history
    if (scene.text) {
      history.push({ char: scene.char || 'Narrator', text: scene.text });
    }

    typeText(scene.text);
  }

  function typeText(text) {
    const el = document.getElementById('dialogText');
    el.textContent = '';
    isTyping = true;
    let i = 0;
    const speed = Math.max(5, 100 - msgSpeed) * 0.3;

    function type() {
      if (i < text.length) {
        el.textContent += text[i++];
        typeTimeout = setTimeout(type, speed);
      } else {
        isTyping = false;
      }
    }
    type();
  }

  function nextDialogue() {
    if (isTyping) {
      clearTimeout(typeTimeout);
      isTyping = false;
      const scene = story[currentIndex];
      document.getElementById('dialogText').textContent = scene.text;
      return;
    }
    currentIndex++;
    if (currentIndex < story.length) {
      showDialogue(currentIndex);
    }
  }

  function showChoices(choices) {
    const overlay = document.getElementById('choicesOverlay');
    overlay.innerHTML = '';
    overlay.classList.add('active');
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = c.text;
      btn.onclick = () => {
        overlay.classList.remove('active');
        currentIndex = c.next;
        showDialogue(currentIndex);
      };
      overlay.appendChild(btn);
    });
  }

  function showHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = history.map(h => `
      <div class="history-item">
        <div class="history-char">${h.char}</div>
        <div class="history-line">${h.text}</div>
      </div>
    `).join('');
    document.getElementById('historyOverlay').classList.add('active');
  }

  function hideHistory() {
    document.getElementById('historyOverlay').classList.remove('active');
  }

  function showSettings() {
    document.getElementById('settingsOverlay').classList.add('active');
  }

  function goToMainMenu() {
    document.getElementById('settingsOverlay').classList.remove('active');
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('mainMenu').style.display = 'flex';
    currentIndex = 0;
    history = [];
  }

  function hideSettings() {
    document.getElementById('settingsOverlay').classList.remove('active');
    // go back to menu if from menu
    if (!document.getElementById('gameScreen').classList.contains('active')) {
      // already on menu
    }
  }

  function updateSetting(input, valId) {
    document.getElementById(valId).textContent = input.value + '%';
    if (valId === 'speedVal') msgSpeed = parseInt(input.value);
  }

  function toggleHide() {
    hidden = !hidden;
    const dialog = document.querySelector('.dialog-box');
    const controls = document.querySelector('.game-controls');
    dialog.style.opacity = hidden ? '0' : '1';
    controls.style.opacity = hidden ? '0' : '1';
  }
</script>
</body>
</html>
